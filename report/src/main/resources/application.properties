spring.application.name=report
spring.config.import=file:./report/.env[.properties]

spring.datasource.url=jdbc:postgresql://${REPORT_DB_HOST}:${REPORT_DB_PORT}/${REPORT_DB_NAME}
spring.datasource.username=${REPORT_DB_USERNAME}
spring.datasource.password=${REPORT_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver